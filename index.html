<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CasaBourse PRO</title>
    <!-- CSS Intégré -->
    <style>
        /* Styles HTML5 et CSS3 Moderne (Thème Sombre/Clair) */
    </style>
</head>
<body>
    <!-- Interface : Bandeau Ticker, Indices MASI, Screener, Portefeuille -->
    <script>
        // JS ES6+ et Intégration Chart.js
        async function fetchBourseData() {
            const timestamp = new Date().getTime();
            try {
                const response = await fetch(`./data.json?t=${timestamp}`);
                const data = await response.json();
                updateDashboard(data);
            } catch (error) {
                console.error("Erreur de récupération des données");
                displayFallbackData();
            }
        }
    </script>
</body>
</html>
