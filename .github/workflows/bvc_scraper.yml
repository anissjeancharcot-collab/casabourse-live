name: BVC Casablanca Auto-Scraper & Live Deploy

on:
  schedule:
    - cron: '*/15 8-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installation de Playwright
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install --with-deps chromium

      - name: ⚡ Exécution du Scraper Live
        run: python scraper_bvc.py

      - name: 🚀 Commit des données actualisées
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Live BVC Data Update [skip ci]"
            git push origin HEAD:main
          fi
