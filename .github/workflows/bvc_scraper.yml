name: BVC Casablanca Auto-Scraper & Live Deploy

on:
  schedule:
    - cron: '*/15 8-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scraper_bvc.py
      - run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update BVC market data [skip ci]" && git push)
