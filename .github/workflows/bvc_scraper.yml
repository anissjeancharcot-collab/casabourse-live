name: BVC Casablanca Auto-Scraper & Live Deploy

on:
  schedule:
    - cron: '*/15 8-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Configuration Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: ⚡ Exécution du Scraper BVC
        run: python scraper_bvc.py

      - name: 🚀 Commit et Push des cours
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update BVC market data [skip ci]"
            git push origin HEAD:main
          else
            echo "Aucune nouvelle donnée à enregistrer."
          fi
