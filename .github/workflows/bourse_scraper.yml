name: Ingestion Quotidienne Bourse de Casablanca

on:
  schedule:
    # 15h15 UTC = 16h15 heure marocaine (GMT+1)
    - cron: '15 15 * * 1-5'
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution du scraper
        run: |
          python scraper.py

      - name: Commit et Push des cotations
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ajoute cotations.json à la racine ET le dossier data/
          git add cotations.json data/
          
          if git diff --staged --quiet; then
            echo "Aucune modification à commiter."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "chore(data): actualisation des cotations boursières - ${TIMESTAMP} [skip ci]"
            git push origin main
          fi
